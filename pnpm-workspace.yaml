# pnpm 11.17+ reads build permissions from here, not .npmrc.
# The older `onlyBuiltDependencies` key is accepted but silently IGNORED.
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260801.0-alpha
  - wrangler@4.119.0

overrides:
  undici: 7.29.0
  # GHSA-2v37-7h3g-55p8: a custom generator with size zero loops forever.
  # Reaches us only through postcss under vite, so it is build-time, never
  # shipped — but `pnpm audit --audit-level=high` is a CI gate.
  nanoid: ^3.3.18
