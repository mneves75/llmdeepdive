# Refuse package versions younger than a day (minutes). A compromised release
# is usually caught and pulled within hours; stated here rather than relying on
# the default.
minimumReleaseAge: 1440

# pnpm 11.17+ reads build permissions from here, not .npmrc.
# The older `onlyBuiltDependencies` key is accepted but silently IGNORED.
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  undici: 7.29.0
  # GHSA-2v37-7h3g-55p8: a custom generator with size zero loops forever.
  # Reaches us only through postcss under vite, so it is build-time, never
  # shipped — but `pnpm audit --audit-level=high` is a CI gate.
  nanoid: ^3.3.18
  # GHSA-px8p-9vwx-vf98: unzipSync can loop forever on a malformed ZIP64
  # archive. satori pins 0.7.3 and only inflates the bundled card fonts at build
  # time, so it is unreachable here; the patch release keeps `pnpm audit` clean.
  fflate: ^0.7.5
