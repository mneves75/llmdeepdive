name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Check the authored candidate; GitHub's temporary PR merge can carry
          # account metadata that is not part of the published Git history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # No later step pushes, so no step needs the job token on disk.
          persist-credentials: false
      - name: Scan full history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --log-opts='--all'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          cache: pnpm
      # Gitleaks finds credentials. This finds the other half — machine-local
      # paths, account subdomains and unknown emails — in tracked files and in
      # commit metadata. It needs no dependencies, but it does need the full
      # history fetched above, so it runs before install and fails fast.
      # PRIVATE_REFS_NAMES additionally forbids specific client, project or
      # tooling names; it is a secret precisely so the list is not published.
      - run: pnpm privacy
        env:
          PRIVATE_REFS_NAMES: ${{ secrets.PRIVATE_REFS_NAMES }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:parity
      - run: pnpm content:stubs
      - run: pnpm content:graph
      - run: pnpm content:citations
      - run: pnpm content:assets
      - run: pnpm content:figures
      - run: pnpm content:excerpts
      - run: pnpm a11y:contrast
      - run: pnpm budget
      # Rendered layout in real engines: overflow, ids, page errors, scroll
      # regions and the inline-maths baseline. Browser builds are pinned by the
      # locked playwright version.
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm render:check --self-test
      - run: pnpm render:check

  # The agent-engineering exercises (tracks 14-25). Website gates never run
  # Python; this job runs every suite a lesson calls runnable. No API key, no
  # model and no paid service: every test uses fixtures or a local service.
  examples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: agentlab-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway service container with no data; the password is not a secret.
      AGENTLAB_PG_DSN: postgresql://postgres:agentlab-ci-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: examples/agent-engineering
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python -m unittest discover -s tests
      # Temporal's SDK downloads its time-skipping test server here.
      - run: uv run --frozen python -m unittest discover -s tests_frameworks
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen python -m unittest discover -s tests_browser
      - run: uv run --frozen python -m unittest discover -s tests_postgres
