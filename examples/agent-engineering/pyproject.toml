[project]
name = "agentlab"
version = "0.1.0"
description = "Runnable exercises for llmdeepdive.com tracks 14-25: a synthetic purchasing assistant built one mechanism at a time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
]

[dependency-groups]
# Framework walkthroughs for 14.5 and 20.3. Kept out of the core so the
# mechanism exercises run with one dependency.
frameworks = [
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
  "temporalio==1.34.0",
]
# Track 18 drives a local synthetic portal in a real browser.
browser = [
  "playwright==1.63.0",
]
# 15.4 against a real Postgres; the core suite uses SQLite.
postgres = [
  "psycopg[binary]==3.3.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.uv]
# Every exercise must resolve exactly what CI resolved.
required-version = ">=0.9"
