<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier portal: reports</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body data-delay="{{delay}}">
<!-- The redesigned page: same roles and names, different structure, order and classes. -->
<div class="shell">
  <nav class="side"><a href="/reports">Reports</a></nav>
  <div class="content">
    {{notice}}
    <section>
      <div class="title-row"><h1>Monthly reports</h1><span class="time">Server time <span role="timer" id="clock">--</span></span></div>
      <div role="status" id="banner"></div>
      <div class="cards">
        <div class="card"><span class="label">July 2026</span><button class="btn-export" data-period="2026-07" aria-label="Download July 2026 CSV">CSV</button></div>
        <div class="card"><span class="label">June 2026</span><button class="btn-export" data-period="2026-06" aria-label="Download June 2026 CSV">CSV</button></div>
        <div class="card"><span class="label">May 2026</span><button class="btn-export" data-period="2026-05" aria-label="Download May 2026 CSV">CSV</button></div>
        <div class="card"><span class="label">April 2026</span><button class="btn-export" data-period="2026-04" aria-label="Download April 2026 CSV">CSV</button></div>
        <div class="card"><span class="label">March 2026</span><button class="btn-export" data-period="2026-03" aria-label="Download March 2026 CSV">CSV</button></div>
      </div>
    </section>
    <footer><p>Signed in as {{user}}</p></footer>
  </div>
</div>
<iframe id="exporter" title="export" hidden></iframe>
<script src="/portal.js"></script>
</body>
</html>
