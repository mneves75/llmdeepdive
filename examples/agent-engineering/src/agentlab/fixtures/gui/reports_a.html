<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier portal: reports</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body data-delay="{{delay}}">
<header><p>Signed in as {{user}}. Server time <span role="timer" id="clock">--</span></p></header>
{{notice}}
<main>
<h1>Monthly reports</h1>
<p role="status" id="banner"></p>
<table id="report-table">
<thead><tr><th>Period</th><th>Export</th></tr></thead>
<tbody>
<tr><td>March 2026</td><td><button class="dl" data-period="2026-03">Download March 2026 CSV</button></td></tr>
<tr><td>April 2026</td><td><button class="dl" data-period="2026-04">Download April 2026 CSV</button></td></tr>
<tr><td>May 2026</td><td><button class="dl" data-period="2026-05">Download May 2026 CSV</button></td></tr>
<tr><td>June 2026</td><td><button class="dl" data-period="2026-06">Download June 2026 CSV</button></td></tr>
<tr><td>July 2026</td><td><button class="dl" data-period="2026-07">Download July 2026 CSV</button></td></tr>
</tbody>
</table>
</main>
<iframe id="exporter" title="export" hidden></iframe>
<script src="/portal.js"></script>
</body>
</html>
