<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier portal: verification</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main>
<h1>Check your phone</h1>
<p>We sent a six-digit code to the phone on this account.</p>
<form method="post" action="/verify">
<p><label for="code">One-time code</label> <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"></p>
<p><button type="submit">Verify</button></p>
</form>
</main>
</body>
</html>
