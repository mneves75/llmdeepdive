<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier portal: sign in</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main>
<h1>Sign in to the supplier portal</h1>
{{message}}
<form method="post" action="/login">
<p><label for="user">Username</label> <input id="user" name="username" autocomplete="username"></p>
<p><label for="pass">Password</label> <input id="pass" name="password" type="password" autocomplete="current-password"></p>
<p><button type="submit">Sign in</button></p>
</form>
</main>
</body>
</html>
